<!-- SERVICES -->
  <section id="services" aria-labelledby="svcTitle">
    <div class="wrap">
      <div class="section-head reveal">
        <span class="eyebrow" data-i18n="svc.eyebrow">Services</span>
        <h2 id="svcTitle" data-i18n="svc.title">Everything your boat needs, under one roof.</h2>
        <p class="lede" data-i18n="svc.lede">From a spring antifouling to a complete refit. Tap a service to add it to your booking.</p>
      </div>
      <div class="tabs reveal" role="tablist" aria-label="Service categories" id="svcTabs">
        <span class="thumb" aria-hidden="true"></span>
        <button role="tab" aria-selected="true" data-filter="all" data-i18n="svc.all">All</button>
        <button role="tab" aria-selected="false" data-filter="hull" data-i18n="svc.hull">Hull &amp; protection</button>
        <button role="tab" aria-selected="false" data-filter="finish" data-i18n="svc.finish">Finish &amp; care</button>
        <button role="tab" aria-selected="false" data-filter="tech" data-i18n="svc.tech">Technical</button>
      </div>
      <div class="svc-grid" id="svcGrid"></div>
    </div>
  </section>
