<!-- BEFORE / AFTER -->
  <section class="ba" id="results" aria-labelledby="baTitle">
    <div class="wrap">
      <div class="ba-copy reveal">
        <span class="eyebrow" data-i18n="ba.eyebrow">Our work</span>
        <h2 id="baTitle" data-i18n="ba.title">See the difference.</h2>
        <p class="lede" data-i18n="ba.lede">Real boats from our yard. Drag the handle to compare before and after.</p>
        <div class="ba-tabs">
          <button class="pill" type="button" data-ba="bow" aria-pressed="true" data-i18n="ba.t1">Antifouling · bow</button>
          <button class="pill" type="button" data-ba="side" aria-pressed="false" data-i18n="ba.t3">Antifouling · hull side</button>
          <button class="pill" type="button" data-ba="grey" aria-pressed="false" data-i18n="ba.t4">Antifouling · new colour</button>
        </div>
        <p class="ba-note" data-i18n="ba.note">Same boat, same angle: photographed before we started and after the new Hempel antifouling.</p>
      </div>
      <div class="compare hint reveal" id="compare" style="--pos:50%">
        <div class="layer before"><img src="img/af-bow-before.jpg" alt="Bow of a motor yacht with worn antifouling, before treatment" loading="lazy" width="1200" height="1600"></div>
        <div class="layer after"><img src="img/af-bow-after.jpg" alt="The same bow with fresh black antifouling" loading="lazy" width="1200" height="1600"></div>
        <span class="tag b" data-i18n="ba.before">Before</span><span class="tag a" data-i18n="ba.after">After</span>
        <div class="bar"><span class="knob"><svg><use href="#i-drag"/></svg></span></div>
        <input type="range" min="0" max="100" value="50" id="compareRange" aria-label="Compare before and after">
      </div>
    </div>
  </section>
