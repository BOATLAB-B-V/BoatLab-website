<!-- FACILITY -->
  <section class="facility" id="facility" aria-labelledby="facTitle">
    <div class="wrap fac-head">
      <div class="section-head reveal">
        <span class="eyebrow" data-i18n="fac.eyebrow">The yard</span>
        <h2 id="facTitle" data-i18n="fac.title">Built for boats. Right on the water.</h2>
        <p class="lede" data-i18n="fac.lede">Indoor halls, a full workshop and a harbour quay with our own crane in Wanssum.</p>
      </div>
      <div class="arrows">
        <button class="arrow" type="button" id="prevShot" aria-label="Previous photo"><svg><use href="#i-left"/></svg></button>
        <button class="arrow" type="button" id="nextShot" aria-label="Next photo"><svg><use href="#i-right"/></svg></button>
      </div>
    </div>
    <div class="track" id="track">
      <button class="slide" type="button" data-full="img/workshop.jpg"><figure style="margin:0"><div class="bleed fade-all"><img src="img/workshop.jpg" alt="Workshop with woodworking machines and a motor yacht" loading="lazy" width="1600" height="1200"></div><figcaption><b data-i18n="fac.c2">Workshop</b><span data-i18n="fac.c2s">Carpentry, parts and tools on site</span></figcaption></figure></button>
      <button class="slide" type="button" data-full="img/hall-motor-yacht.jpg"><figure style="margin:0"><div class="bleed fade-all"><img src="img/hall-motor-yacht.jpg" alt="Motor yacht indoors in the service hall" loading="lazy" width="1600" height="1200"></div><figcaption><b data-i18n="fac.c3">Indoor hall</b><span data-i18n="fac.c3s">Work continues whatever the weather</span></figcaption></figure></button>
      <button class="slide" type="button" data-full="img/bow-fenders.jpg"><figure style="margin:0"><div class="bleed fade-all"><img src="img/bow-fenders.jpg" alt="Freshly finished motor yacht on stands in front of the hall" loading="lazy" width="1600" height="1200"></div><figcaption><b data-i18n="fac.c4">Ready to launch</b><span data-i18n="fac.c4s">Fresh antifouling, ready for the season</span></figcaption></figure></button>
      <button class="slide" type="button" data-full="img/crane-quay.jpg"><figure style="margin:0"><div class="bleed fade-all"><img src="img/crane-quay.jpg" alt="Black sports cruiser hanging in the crane slings on the quay" loading="lazy" width="1600" height="1200"></div><figcaption><b data-i18n="fac.c5">30 t crane</b><span data-i18n="fac.c5s">Out of the water in minutes</span></figcaption></figure></button>
      <button class="slide" type="button" data-full="img/boat-mover.jpg"><figure style="margin:0"><div class="bleed fade-all"><img src="img/boat-mover.jpg" alt="Remote-controlled hydraulic boat mover on the quay" loading="lazy" width="1600" height="1200"></div><figcaption><b data-i18n="fac.c6">Boat mover</b><span data-i18n="fac.c6s">Remote-controlled transport across the yard</span></figcaption></figure></button>

    <div class="dots" id="dots" aria-hidden="true"></div>
